<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 538 755" width="538" height="755" role="img" aria-labelledby="erd-title erd-desc"><title id="erd-title">Know Yellowknife community models</title><desc id="erd-desc">Profiles write posts and comments, add likes and follow other profiles. Comments and likes attach to posts.</desc><metadata data-format="mermaid">erDiagram
    accTitle: Know Yellowknife community models
    accDescr: Profiles write posts and comments, add likes and follow other profiles. Comments and likes attach to posts.
    Profile ||..o{ Post : writes
    Profile ||..o{ Comment : authors
    Profile ||..o{ Like : adds
    Follower }o..|| Profile : "from profile"
    Follower }o..|| Profile : "to profile"
    Post ||..o{ Comment : receives
    Post ||..o{ Like : receives

    Post {
        bigint id PK
        bigint profile_id FK
        string title
    }
    Comment {
        bigint id PK
        bigint profile_id FK
        bigint post_id FK
    }
    Like {
        bigint id PK
        bigint profile_id FK
        bigint post_id FK
    }
    Follower {
        bigint id PK
        bigint profile_id FK
        bigint followed_profile_id FK
    }</metadata><style>:root {
  --panel:#f7fafc; --border:#c7d8e4; --heading:#14354b; --accent:#128276;
